name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler (the Worker dry-run bundle step) requires Node >= 22.
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Runs the node:test suites under tests/unit. These need no Cloudflare
      # deployment. Worker route coverage is enforced offline by
      # tests/unit/routeParity.test.js, which asserts every Express route has a
      # Worker counterpart (a missing Worker route is how POST /pictures/custom
      # once 404ed in production while CI stayed green).
      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      # Boots the real Node server on localhost and exercises the HTTP API end
      # to end (custom pictures, instance lifecycle incl. expired delete/restore,
      # auth bans). Fully offline: everything runs against 127.0.0.1.
      - name: Run integration tests
        run: ./test.sh

      # The Worker must keep bundling: a broken import or TS syntax error would
      # otherwise only surface at deploy time.
      - name: Bundle Cloudflare Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker-build
        env:
          WRANGLER_SEND_METRICS: "false"
